[project]
name = "dbig-workspace"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# `uv export --format cyclonedx1.5`, required by scripts/supply_chain.py, first ships in uv
# 0.10.0; 0.9.0 and earlier reject the format during argument parsing, before uv reads this
# floor. uv still fails closed here for lock, sync and run, and scripts/ci_check.py keeps the
# workflow uv pin at or above it.
required-version = ">=0.10.0"

[tool.uv.workspace]
members = ["packages/*"]

# Pinned developer graph tools. scripts/graph_sync.py refuses to index with any other version,
# and scripts/ci_check.py refuses a workflow that installs anything but these exact pins, so a
# developer and CI can never build the three graphs from different tool versions. The `graphify`
# command ships in the `graphifyy` distribution, hence the separate `distribution` field.
[tool.dbig.graph-tools.graphify]
version = "0.9.103"
distribution = "graphifyy"
ecosystem = "pypi"

[tool.dbig.graph-tools.graft]
version = "0.29.0"
distribution = "@nanonets/graft"
ecosystem = "npm"

[tool.dbig.graph-tools.codebase-memory-mcp]
version = "0.12.1"
distribution = "codebase-memory-mcp"
ecosystem = "pypi"

[dependency-groups]
dev = [
  "dbig-contracts",
  "dbig-collectors[api]",
  "dbig-catalog-builder",
  "dbig-catalogue-requester[api]",
  "dbig-lineage-planner[api]",
  "pytest>=9.0.3,<10",
  "ruff>=0.13,<0.14",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
]

[tool.uv.sources]
dbig-contracts = { workspace = true }
dbig-collectors = { workspace = true }
dbig-catalog-builder = { workspace = true }
dbig-catalogue-requester = { workspace = true }
dbig-lineage-planner = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Live-test evidence (artifacts/) is a record of one run, not application code.
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["packages"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
