[project]
name = "dbig-catalog-builder"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "dbig-contracts==0.1.0",
  "click>=8.2,<9",
  "rapidfuzz>=3.14,<4",
  "langgraph>=1.2,<2",
  "openai>=2,<3",
  "langfuse>=4,<5",
]

[project.scripts]
dbig-builder = "dbig_builder.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbig_builder"]

[tool.uv.sources]
dbig-contracts = { workspace = true }
