[project]
name = "dbig-contracts"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.120,<1", "uvicorn>=0.35,<1"]

[project.scripts]
dbig-contracts = "dbig_contracts.api:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbig_contracts"]
