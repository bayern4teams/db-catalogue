[project]
name = "dbig-catalogue-requester"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["dbig-contracts==0.1.0", "click>=8.2,<9", "pydantic>=2.11,<3", "openai>=2,<3", "langfuse>=4,<5"]

[project.optional-dependencies]
api = ["fastapi>=0.120,<1", "uvicorn>=0.35,<1"]

[project.scripts]
dbig-requester = "dbig_requester.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbig_requester"]

[tool.uv.sources]
dbig-contracts = { workspace = true }
