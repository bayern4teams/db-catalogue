# Connection JSON in MONGODB_CONNECTION: {"uri": "mongodb://user:pass@host:27017/?authSource=appdb"}
[source]
source_id = "mongo-main"
kind = "mongodb"
connection_env = "MONGODB_CONNECTION"
signing_key_env = "DBIG_SIGNING_KEY"
signing_key_id = "local"
namespaces = ["appdb"]                 # MongoDB databases to catalogue
# tls_ca_file = "C:/certs/company-ca.pem"

# MongoDB has no declared columns: fields come from a collection's validator and from sampled
# documents. Without sampling, a collection with no validator shows no fields at all. Only
# field paths and types are kept, never values. Up to this many documents per collection;
# max_sample_bytes (default 1 MiB) bounds the whole source and is reported if reached.
sample_rows = 100

# Query budget. MongoDB charges one query per database, one per collection, and one more per
# sampled collection, so allow about 3 x collections + databases. The run stops with no bundle
# and says so if this is too low.
max_queries = 500

# value_token_key_env = "DBIG_TOKEN_KEY"   # same key and id as the other sources in this run
# value_token_key_id = "run-1"

# Optional distinct-count probe (default off): one aggregation per collection, counts only,
# for the scalar field paths known from the validator or the sample (set sample_rows too, or
# only validator paths are probed). Charged to max_queries; a scan request needs `sample`.
# cardinality_probe = true
# cardinality_probe_max_columns = 20
# cardinality_probe_max_rows = 100000

# Optional value-free format profiles (default off): per text, integer or uuid column, the value
# length range, the share of digit, hex, uuid and letter values and the most common value shapes
# (digits 9, letters a). Computed from the sampled documents (set sample_rows): no extra query.
# Integer columns also write their smallest and largest value to the local-only ranges.jsonl.
# Reads data (aggregates only), so a scan request needs the `sample` capability.
# format_profiles = true
# format_profile_max_formats = 8     # most common shapes kept per column
# format_token_max_length = 64       # longest value prefix a shape is made from
