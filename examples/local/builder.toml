# The key ID on the left must match `signing_key_id` in the source files; the value is the
# environment variable that holds the key.
[builder]
signing_keys = { local = "DBIG_SIGNING_KEY" }

# Optional inference settings (defaults shown; remove the leading # to change one).
# A measured value overlap of 0 found out of at least this many compared values drops a
# cross-source candidate; below it the candidate stays, marked "sample too small". Only
# applies when the source files set sample_rows and value_token_key_env.
# min_token_support = 4
# Confidence level of the interval shown on a measured value overlap (strictly between 0 and 1).
# overlap_confidence_level = 0.95
# Optional operator knowledge. Cross-source candidates are proposed only between sources of
# the same group (a source in no group is unrestricted) and never between a forbidden pair.
# Default: none, so nothing is restricted.
# source_groups = [["postgres_main", "mongo_main"]]
# forbidden_source_pairs = [["postgres_main", "clickhouse_main"]]
# A candidate is "verified" when at least this share of the child's compared values is found in the
# parent; below it the candidate is "plausible" (one source) or "unverified_cross_source" (two).
# The requester and planner leave out the latter unless their include_unverified_cross_source is true.
# c_min = 0.25
# A zero against a partly read parent drops the candidate when the expected number of shared values
# at c_min (child values x share of the parent read x c_min) is at least this. Needs a distinct estimate.
# min_expected_shared = 5
# A candidate is dropped when the child column's most common value shape (digits 9, letters a)
# covers at least this share of its values and the parent has no such shape, when two text columns'
# value lengths cannot meet, or when two integer columns' ranges do not overlap. Needs the sources'
# format_profiles = true. Strictly above 0, at most 1.
# format_reject_share = 0.95
# Owner decisions: a JSON list of {"child": "<source_id>.<namespace>.<table>.<column>", "parent": "...",
# "decision": "confirmed" | "rejected"}; namespace left out when the object has none.
# decisions_file = "decisions.json"
# decisions_file_max_bytes = 1048576   # larger decisions files are refused
