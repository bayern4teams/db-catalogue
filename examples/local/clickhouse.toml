# Connection JSON in CLICKHOUSE_CONNECTION: {"host", "port", "username", "password"}.
# With TLS (the default) use the server's HTTPS port, 8443 unless your server says otherwise.
[source]
source_id = "ch-main"
kind = "clickhouse"
connection_env = "CLICKHOUSE_CONNECTION"
signing_key_env = "DBIG_SIGNING_KEY"
signing_key_id = "local"
namespaces = ["default"]               # ClickHouse databases to catalogue
# tls_ca_file = "C:/certs/company-ca.pem"

# Optional distinct-count probe (default off). ClickHouse keeps no per-column statistics, so
# without it no column measures as a unique parent key. One extra query per table, charged to
# max_queries; it reads data (counts only, nothing is stored), so a scan request needs the
# `sample` capability. It reads up to this many columns and counts exactly this many rows per
# table (the server may read about one block more).
# cardinality_probe = true
# cardinality_probe_max_columns = 20
# cardinality_probe_max_rows = 100000

# Optional value-free format profiles (default off): per text, integer or uuid column, the value
# length range, the share of digit, hex, uuid and letter values and the most common value shapes
# (digits 9, letters a). One read-only query per column over the whole column, charged to max_queries.
# Integer columns also write their smallest and largest value to the local-only ranges.jsonl.
# Reads data (aggregates only), so a scan request needs the `sample` capability.
# format_profiles = true
# format_profile_max_formats = 8     # most common shapes kept per column
# format_token_max_length = 64       # longest value prefix a shape is made from

# Optional value hashes for cross-source overlap (default off; reads the first sample_rows rows of
# each table, plain columns only). Same key and id as the other sources in this run.
# sample_rows = 100
# value_token_key_env = "DBIG_TOKEN_KEY"
# value_token_key_id = "run-1"
