# For `dbig-requester ask`. `search` and `index` need only the [requester] table; see
# docs/LOCAL_RUN.md for the version the runbook writes per run.
[requester]
snapshot_dir = "artifacts/run-latest/snapshot"   # the snapshot `assemble` wrote
state_dir = "artifacts/run-latest/requester"     # where the search index is kept
api_key_env = "REQUESTER_TOKEN"                  # bearer token, used only by `serve`

[requester.answer]
# Same rules as the builder's review: plain HTTP only to a loopback IP literal.
base_url = "http://127.0.0.1:8000/v1"
model = "replace-with-the-model-name-vllm-serves"
model_digest = "replace-with-the-revision-you-pinned"
api_key_env = "VLLM_API_KEY"
timeout_seconds = 60
retrieval_limit = 10    # catalogue entries given to the model per question
# answer_retries = 1       # extra attempts when the model replies with only a verdict and no explanation; 0 makes one attempt
# relationship_limit = 20   # relationship edges (declared and candidate, with evidence status) given to the model; 0 turns them off
# path_max_hops = 4          # longest relationship path, in edges, searched between retrieved tables for bridge tables
# path_max_bridge_tables = 4  # most tables added to the model context only because they lie on such a path; 0 turns the search off
# include_unverified_cross_source = false  # true also gives the model candidates between two sources with no positive measurement (evidence_tier unverified_cross_source); a rejected edge never returns

# Optional: hide schema-description collections from search and `ask`, per source id,
# glob patterns on the object name. Applied by `dbig-requester index`. Default: none.
# [requester.exclude_objects]
# mongo_main = ["*__schemas", "*_source_profiles"]
