name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require deployable package and locked environment
        run: |
          test -f pyproject.toml
          test -f uv.lock
          test -d src
          uv sync --locked --all-extras --dev
      - name: Verify code, tests and dependencies
        run: |
          python scripts/ci_check.py
          uv run ruff check .
          uv run mypy src
          uv run pytest
          uv run pip-audit
      - name: Refresh all developer graphs
        run: |
          python -m pip install graphifyy==0.9.65 codebase-memory-mcp==0.11.0
          npm install --global @nanonets/graft@0.18.0
          python scripts/graph_sync.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish verified GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
