name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '22'
      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require deployable package and locked environment
        run: |
          test -f pyproject.toml
          test -f uv.lock
          uv sync --locked --all-packages --all-extras --dev
      - name: Verify code, tests and dependencies
        run: |
          python scripts/ci_check.py
          python scripts/check_release_version.py "${GITHUB_REF_NAME}"
          uv run ruff check .
          uv run mypy packages
          uv run pytest
          uv run pip-audit
      - name: Refresh all developer graphs
        run: |
          python -m pip install graphifyy==0.9.104 codebase-memory-mcp==0.12.1
          npm install --global @nanonets/graft@0.29.0
          python scripts/graph_sync.py
      - name: Build wheel and source distribution
        run: uv build --all-packages
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the five service images
        # Owner decision 10 (2026-11-21): the five images on both remotes, private like the
        # repository. Names, build arguments and the smoke test live in scripts/build_images.py.
        # No image signing: keyless cosign writes to the public Sigstore log (normalization
        # release.yml carries the same rule).
        run: >-
          python scripts/build_images.py --version "${GITHUB_REF_NAME#v}" --push
          --registry "ghcr.io/${GITHUB_REPOSITORY,,}/"
      - name: Publish verified GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
          --notes "Images: ghcr.io/${GITHUB_REPOSITORY,,}/dbig-*:${GITHUB_REF_NAME}.
          Deploy: docs/DEPLOY.md."
