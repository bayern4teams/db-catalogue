name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate repository contracts
        run: |
          python -m compileall -q scripts
          python scripts/ci_check.py

  graph-index:
    name: graph-index
    runs-on: ubuntu-latest
    needs: repository-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install reviewed graph tool versions
        run: |
          python -m pip install graphifyy==0.9.65 codebase-memory-mcp==0.11.0
          npm install --global @nanonets/graft@0.18.0
      - name: Build and check all developer graphs
        run: python scripts/graph_sync.py

  application-quality:
    name: application-quality
    runs-on: ubuntu-latest
    needs: repository-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: 'false'
      - name: Locked dependencies, lint, types, tests and vulnerability audit
        run: |
          if [ ! -f pyproject.toml ]; then
            echo 'Architecture repository: application package is not implemented yet.'
            exit 0
          fi
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run mypy packages
          uv run pytest
          uv run pip-audit

  package-isolation:
    name: package-isolation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: repository-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: 'false'
      - name: Build and verify clean requester/planner wheels
        run: |
          uv build --all-packages
          python scripts/package_isolation.py

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [repository-policy, graph-index, application-quality, package-isolation]
    if: always()
    steps:
      - name: Require all applicable gates
        env:
          POLICY: ${{ needs.repository-policy.result }}
          GRAPH: ${{ needs.graph-index.result }}
          APPLICATION: ${{ needs.application-quality.result }}
          ISOLATION: ${{ needs.package-isolation.result }}
        run: |
          test "$POLICY" = success
          test "$GRAPH" = success
          test "$APPLICATION" = success -o "$APPLICATION" = skipped
          test "$ISOLATION" = success
