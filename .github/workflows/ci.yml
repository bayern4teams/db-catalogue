name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate repository contracts
        run: |
          python -m compileall -q scripts
          python scripts/ci_check.py

  graph-index:
    name: graph-index
    runs-on: ubuntu-latest
    needs: repository-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install reviewed graph tool versions
        run: |
          python -m pip install graphifyy==0.9.100 codebase-memory-mcp==0.12.1
          npm install --global @nanonets/graft@0.18.0
      - name: Build and check all developer graphs
        run: python scripts/graph_sync.py

  application-quality:
    name: application-quality
    runs-on: ubuntu-latest
    needs: repository-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: 'false'
          version: '0.12.19'
      - name: Locked dependencies, lint, types, tests and vulnerability audit
        run: |
          if [ ! -f pyproject.toml ]; then
            echo 'Architecture repository: application package is not implemented yet.'
            exit 0
          fi
          uv sync --locked --all-extras --dev
          uv run ruff check .
          uv run mypy packages
          uv run pytest
          uv run pip-audit
          python scripts/supply_chain.py

  package-isolation:
    name: package-isolation-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: repository-policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: 'false'
          version: '0.12.19'
      - name: Build and verify clean requester/planner wheels
        run: |
          uv build --all-packages
          python scripts/package_isolation.py

  source-integration:
    # The pinned versions keep the original check name; the latest released versions run beside
    # them, so a new major release is tested before an operator meets it (verified locally
    # against these exact versions on 2026-10-04; PostgreSQL 19 was still a beta).
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    needs: repository-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: source-integration
            postgres: postgres:16.15-alpine3.23
            clickhouse: clickhouse/clickhouse-server:25.8.33.6
            mongo: mongo:7.0.41-jammy
          - check: source-integration-latest
            postgres: postgres:18.6-alpine3.24
            clickhouse: clickhouse/clickhouse-server:26.9.10.4
            mongo: mongo:9.0.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: 'false'
          version: '0.12.19'
      # PostgreSQL is started here rather than as a service container because `collect`
      # requires verified TLS, and a service container cannot mount a certificate generated in
      # an earlier step. The CA is throwaway: one job, loopback only, never committed.
      - name: Start PostgreSQL with TLS
        run: |
          python3 scripts/make_ci_certs.py --out "$RUNNER_TEMP/certs"
          # The alpine image runs as uid 70, and PostgreSQL refuses a key any other user can read.
          sudo chown 70:70 "$RUNNER_TEMP/certs/server.key" "$RUNNER_TEMP/certs/server.crt"
          docker run -d --name dbig-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            -v "$RUNNER_TEMP/certs:/certs:ro" \
            ${{ matrix.postgres }} \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
      # ClickHouse and MongoDB also serve TLS, from the same throwaway CA, and keep their
      # plaintext ports so the metadata tests and the loopback plaintext opt-out still have a
      # server. Each gets its own copy of the key, owned by the uid its image runs as.
      - name: Start ClickHouse and MongoDB with TLS
        run: |
          certs="$RUNNER_TEMP/certs"
          mkdir "$RUNNER_TEMP/certs-ch" "$RUNNER_TEMP/certs-mongo"
          # sudo: the PostgreSQL step already gave server.key to uid 70 with mode 600, so the
          # runner user can no longer read it. Running as root locally hid this; CI did not.
          sudo cp "$certs/server.crt" "$certs/server.key" "$RUNNER_TEMP/certs-ch/"
          sudo cp "$certs/server.pem" "$certs/ca.crt" "$RUNNER_TEMP/certs-mongo/"
          printf '%s\n' '<clickhouse>' '  <https_port>8443</https_port>' '  <openSSL><server>' \
            '    <certificateFile>/certs/server.crt</certificateFile>' \
            '    <privateKeyFile>/certs/server.key</privateKeyFile>' \
            '  </server></openSSL>' '</clickhouse>' > "$RUNNER_TEMP/clickhouse-tls.xml"
          sudo chown -R 101:101 "$RUNNER_TEMP/certs-ch"
          sudo chown -R 999:999 "$RUNNER_TEMP/certs-mongo"
          docker run -d --name dbig-clickhouse \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 -p 8123:8123 -p 8443:8443 \
            -v "$RUNNER_TEMP/certs-ch:/certs:ro" \
            -v "$RUNNER_TEMP/clickhouse-tls.xml:/etc/clickhouse-server/config.d/tls.xml:ro" \
            ${{ matrix.clickhouse }}
          docker run -d --name dbig-mongo -p 27017:27017 \
            -v "$RUNNER_TEMP/certs-mongo:/certs:ro" \
            ${{ matrix.mongo }} \
            --tlsMode preferTLS --tlsCertificateKeyFile /certs/server.pem \
            --tlsCAFile /certs/ca.crt --tlsAllowConnectionsWithoutCertificates
      - name: Verify source catalog APIs with synthetic schemas
        env:
          DBIG_RUN_INTEGRATION: '1'
          # Appends the throwaway CA to the system store, so the fixtures verify and every other
          # TLS connection in the job keeps working.
          SSL_CERT_FILE: ${{ runner.temp }}/certs/trust-bundle.crt
          # test_live_tls.py removes SSL_CERT_FILE and trusts this CA only through tls_ca_file.
          DBIG_TEST_CA_FILE: ${{ runner.temp }}/certs/ca.crt
        run: |
          uv sync --locked --all-packages --all-extras --dev
          uv run --locked --all-packages --all-extras pytest -q -rs \
            tests/test_live_collectors.py tests/test_live_pipeline.py tests/test_live_tls.py \
            tests/test_live_operator_errors.py tests/test_live_plans.py \
            tests/test_operator_errors.py tests/test_live_scans.py tests/test_live_shapes.py
      - name: Container logs on failure
        if: failure()
        run: |
          for name in dbig-postgres dbig-clickhouse dbig-mongo; do
            echo "== $name"; docker logs "$name" 2>&1 | tail -50
          done

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [repository-policy, graph-index, application-quality, package-isolation, source-integration]
    if: always()
    steps:
      - name: Require all applicable gates
        env:
          POLICY: ${{ needs.repository-policy.result }}
          GRAPH: ${{ needs.graph-index.result }}
          APPLICATION: ${{ needs.application-quality.result }}
          ISOLATION: ${{ needs.package-isolation.result }}
          INTEGRATION: ${{ needs.source-integration.result }}
        run: |
          test "$POLICY" = success
          test "$GRAPH" = success
          test "$APPLICATION" = success -o "$APPLICATION" = skipped
          test "$ISOLATION" = success
          test "$INTEGRATION" = success
