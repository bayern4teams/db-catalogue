# Collector source slot 3 (deploy/compose.sources.yaml `collectors-mongo`); see collector-slot1.toml.
[source]
source_id = "${SOURCE_ID_3}"
kind = "mongodb"
connection_env = "DBIG_SOURCE_CONNECTION"
signing_key_env = "DBIG_SIGNING_KEY"
signing_key_id = "local"
namespaces = ["${SOURCE_NAMESPACES_3}"]
tls = true
tls_ca_file = "/run/secrets/source_ca_bundle"
