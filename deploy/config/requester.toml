# The requester service (deploy/compose.yaml `requester`). ${NAME} reads the container
# environment, filled from deploy/.env (owner decision 11).
[requester]
snapshot_dir = "/data/snapshots/current"
state_dir = "/var/lib/dbig/state"
# With DBIG_CALLER_KEYS_FILE mounted (decision 16: per-caller keys), api_key_env is unused;
# it still must name a resolvable variable, and this one always resolves to the key file path.
api_key_env = "DBIG_CALLER_KEYS_FILE"

# Grounded answers from the private vLLM (decision 3). Plain HTTP allowed by
# DBIG_ALLOW_PLAIN_LAN=1 (decision 12, C5 review 2027-05-21). model_digest changes with the
# model: update VLLM_MODEL_DIGEST in deploy/.env when the model server is upgraded.
[requester.answer]
base_url = "${VLLM_BASE_URL}"
model = "${VLLM_MODEL}"
model_digest = "${VLLM_MODEL_DIGEST}"
api_key_env = "DBIG_MODEL_KEY"
# Reasoning models answer slowly: the measured direct call took 12 s and a full context took
# over 20 s (laptop rehearsal 2026-11-22, MODEL_TIMEOUT for the two slowest questions). 60 s
# covers the observed answers with room; the timeout is what makes a dead model an operator-
# visible 503 instead of a hung request.
timeout_seconds = 60
langfuse_url = "${LANGFUSE_URL}"
langfuse_public_key_env = "DBIG_LANGFUSE_PUBLIC_KEY"
langfuse_secret_key_env = "DBIG_LANGFUSE_SECRET_KEY"

# Scan requests over the private collector HTTP adapter (decision 14: plain HTTP on the LAN).
# Every database in deploy/sources.toml may be scanned, in its listed namespaces, through the
# one collector (owner 2026-11-22, answer B1).
[requester.scan]
signing_key_env = "DBIG_SIGNING_KEY"
key_id = "local"
allowed_capabilities = ["metadata"]
http_token_env = "DBIG_COLLECTOR_TOKEN"
sources_file = "/etc/dbig/sources.toml"
collector_url = "http://${COLLECTOR_IP}:8443"
